x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    DBT_PROFILES_DIR: /dbt
    DUCKDB_PATH: /data/searchflow.duckdb
    REDIS_HOST: redis
    POSTGRES_HOST: postgres
    MLFLOW_TRACKING_URI: http://mlflow:5000
    AIRFLOW__METRICS__STATSD_ON: 'true'
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: '9125'
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./dbt_transform:/dbt
    - ./data:/data
    - ./event_generator:/event_generator
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - searchflow-network

services:
  # ============================================
  # DATABASE SERVICES
  # ============================================
  
  postgres:
    image: postgres:15
    container_name: searchflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      # Additional DB for CRM simulation
      POSTGRES_MULTIPLE_DATABASES: searchflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/init-mlflow-db.sql:/docker-entrypoint-initdb.d/02-mlflow.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - searchflow-network

  redis:
    image: redis:7-alpine
    container_name: searchflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - searchflow-network

  # ============================================
  # AIRFLOW SERVICES
  # ============================================
  
  airflow-init:
    <<: *airflow-common
    container_name: searchflow-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@searchflow.local
        # Install additional Python packages
        pip install duckdb redis "dbt-duckdb>=1.8.0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: searchflow-airflow-webserver
    command: bash -c "pip install duckdb redis "dbt-duckdb>=1.8.0" && airflow webserver"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: searchflow-airflow-scheduler
    command: bash -c "pip install duckdb redis "dbt-duckdb>=1.8.0" && airflow scheduler"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # APPLICATION SERVICES
  # ============================================
  
  event-generator:
    build:
      context: ./event_generator
      dockerfile: Dockerfile
    container_name: searchflow-event-generator
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTPUT_DIR: /data/raw
      EVENTS_PER_SECOND: 10
      CLICK_THROUGH_RATE: 0.30
      CONVERSION_RATE: 0.10
      USER_POOL_SIZE: 10000
      ANONYMOUS_RATE: 0.40
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data:/data
      - ./event_generator/src:/app/src
    depends_on:
      - redis
    networks:
      - searchflow-network
    # Run continuously in background, or use command to run once
    command: python -m src.main --mode continuous

  reverse-etl:
    build:
      context: ./reverse_etl
      dockerfile: Dockerfile
    container_name: searchflow-reverse-etl
    environment:
      DUCKDB_PATH: /data/searchflow.duckdb
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: searchflow
      POSTGRES_USER: searchflow
      POSTGRES_PASSWORD: searchflow123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./data:/data
      - ./reverse_etl/src:/app/src
    depends_on:
      - postgres
      - redis
    networks:
      - searchflow-network
    # Typically triggered by Airflow, but can run standalone
    command: sleep infinity

  # ============================================
  # ML ENGINE
  # ============================================
  
  ml-engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    container_name: searchflow-ml-engine
    environment:
      DUCKDB_PATH: /data/searchflow.duckdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MODEL_PATH: /app/models
      CACHE_TTL: 3600
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/data
      - ./ml_engine/models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - searchflow-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # SEARCH ASSISTANT
  # ============================================

  search-assistant:
    build:
      context: ./search_assistant
      dockerfile: Dockerfile
    container_name: searchflow-search-assistant
    environment:
      ML_ENGINE_URL: http://ml-engine:8000
      DUCKDB_PATH: /data/searchflow.duckdb
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "8001:8001"
    depends_on:
      ml-engine:
        condition: service_healthy
    networks:
      - searchflow-network

  # ============================================
  # STREAMING SERVICES
  # ============================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: searchflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: searchflow-kafka-cluster-001
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - searchflow-network

  kafka-consumer:
    build:
      context: ./kafka_consumer
      dockerfile: Dockerfile
    container_name: searchflow-kafka-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DUCKDB_PATH: /data/searchflow.duckdb
    volumes:
      - ./data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - searchflow-network

  # ============================================
  # MLFLOW
  # ============================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    container_name: searchflow-mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://airflow:airflow@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: /data/mlflow-artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://airflow:airflow@postgres:5432/mlflow
      --artifacts-destination /data/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - searchflow-network

  # ============================================
  # SPARK
  # ============================================

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: searchflow-spark
    environment:
      SPARK_MODE: master
      SPARK_MASTER_URL: spark://spark:7077
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: searchflow
      POSTGRES_USER: searchflow
      POSTGRES_PASSWORD: searchflow123
    volumes:
      - ./data:/data
      - ./spark:/app
    ports:
      - "8088:8080"
      - "7077:7077"
    depends_on:
      - postgres
    networks:
      - searchflow-network
    command: >
      bash -c "
        /opt/bitnami/scripts/spark/entrypoint.sh /opt/bitnami/scripts/spark/run.sh &
        sleep infinity
      "

  # ============================================
  # VISUALIZATION
  # ============================================
  
  metabase:
    image: metabase/metabase:latest
    container_name: searchflow-metabase
    hostname: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: airflow
      MB_DB_PASS: airflow
      MB_DB_HOST: postgres
      MB_JETTY_HOST: 0.0.0.0
    depends_on:
      - postgres
    networks:
      - searchflow-network

  # ============================================
  # OBSERVABILITY STACK
  # ============================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: searchflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - searchflow-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: searchflow-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - searchflow-network

  loki:
    image: grafana/loki:3.3.0
    container_name: searchflow-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - searchflow-network

  statsd-exporter:
    image: prom/statsd-exporter:v0.27.1
    container_name: searchflow-statsd-exporter
    ports:
      - "9125:9125/udp"
      - "9102:9102"
    restart: unless-stopped
    networks:
      - searchflow-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: searchflow-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:9092'
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - searchflow-network

  promtail:
    image: grafana/promtail:3.3.0
    container_name: searchflow-promtail
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - searchflow-network

# ============================================
# VOLUMES & NETWORKS
# ============================================

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  searchflow-network:
    driver: bridge
