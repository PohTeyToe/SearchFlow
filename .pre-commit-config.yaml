repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint
        files: dbt_transform/
        additional_dependencies: ['dbt-duckdb>=1.8.0', 'sqlfluff-templater-dbt']

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: dashboard/src/.*\.[jt]sx?$
        additional_dependencies:
          - eslint
