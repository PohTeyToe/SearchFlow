version: 2

sources:
  - name: raw
    description: "Raw event data ingested from the event generator"
    database: searchflow
    schema: raw
    
    tables:
      - name: search_events
        description: "Raw search events from the event generator"
        columns:
          - name: event_id
            description: "Unique identifier for the event"
            tests:
              - unique
              - not_null
          - name: payload
            description: "JSON payload containing all event data"
            tests:
              - not_null
          - name: ingested_at
            description: "Timestamp when event was ingested"
        freshness:
          warn_after: {count: 1, period: hour}
          error_after: {count: 6, period: hour}
        loaded_at_field: ingested_at
      
      - name: click_events
        description: "Raw click events from the event generator"
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
          - name: payload
            tests:
              - not_null
        freshness:
          warn_after: {count: 1, period: hour}
          error_after: {count: 6, period: hour}
        loaded_at_field: ingested_at
      
      - name: conversion_events
        description: "Raw conversion/booking events from the event generator"
        columns:
          - name: event_id
            tests:
              - unique
              - not_null
          - name: payload
            tests:
              - not_null
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 6, period: hour}
        loaded_at_field: ingested_at

  - name: hotel_bookings
    description: "Hotel booking demand dataset (Antonio et al., 2019)"
    tables:
      - name: hotel_bookings
        description: "119,390 hotel bookings with guest, booking, and stay details"
        columns:
          - name: lead_time
            description: "Days between booking and arrival"
          - name: stays_in_weekend_nights
            description: "Number of weekend nights stayed"
          - name: stays_in_week_nights
            description: "Number of week nights stayed"
          - name: adults
            description: "Number of adult guests"
          - name: children
            description: "Number of child guests (nullable)"
          - name: babies
            description: "Number of baby guests"
          - name: deposit_type
            description: "Deposit type: No Deposit, Non Refund, Refundable"
          - name: market_segment
            description: "Market segment category"
          - name: customer_type
            description: "Customer type category"
          - name: is_canceled
            description: "Whether booking was canceled (0/1)"
          - name: adr
            description: "Average daily rate"
          - name: is_repeated_guest
            description: "Whether guest is a repeat visitor (0/1)"
