name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff sqlfluff dbt-duckdb>=1.8.0 sqlfluff-templater-dbt
      - name: Ruff check
        run: ruff check .
      - name: SQLFluff lint
        run: sqlfluff lint dbt_transform/models/ --dialect duckdb || true
        continue-on-error: true

  dbt-build:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install dbt-duckdb>=1.8.0
      - name: dbt deps
        working-directory: ./dbt_transform
        run: dbt deps
      - name: dbt build
        working-directory: ./dbt_transform
        run: dbt build --profiles-dir .
      - name: dbt test
        working-directory: ./dbt_transform
        run: dbt test --profiles-dir .

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML engine dependencies
        run: |
          pip install pytest numpy pandas scikit-learn xgboost shap joblib
          pip install fastapi httpx uvicorn pydantic redis slowapi
          pip install mlflow>=3.10.0 prometheus-fastapi-instrumentator
          pip install structlog pyyaml
          pip install evidently>=0.4.0

      - name: Install event generator dependencies
        run: pip install click redis confluent-kafka faker pydantic

      - name: Install kafka consumer dependencies
        run: pip install confluent-kafka duckdb python-dotenv

      - name: Install search assistant dependencies
        run: |
          pip install langchain langchain-core langchain-anthropic langgraph
          pip install fastapi httpx uvicorn duckdb pydantic

      - name: Run ML engine tests
        working-directory: ./ml_engine
        run: python -m pytest tests/ -v --tb=short

      - name: Run event generator tests
        working-directory: ./event_generator
        run: python -m pytest tests/ -v --tb=short

      - name: Run kafka consumer tests
        working-directory: ./kafka_consumer
        run: python -m pytest tests/ -v --tb=short

      - name: Run search assistant tests
        working-directory: ./search_assistant
        run: python -m pytest tests/ -v --tb=short

  model-eval:
    name: Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install numpy pandas scikit-learn xgboost shap joblib mlflow>=3.10.0
      - name: Cache hotel bookings dataset
        uses: actions/cache@v4
        with:
          path: data/raw/hotel_bookings.csv
          key: dataset-${{ hashFiles('scripts/download_datasets.sh') }}
      - name: Download datasets
        run: |
          if [ ! -f data/raw/hotel_bookings.csv ]; then
            bash scripts/download_datasets.sh
          fi
      - name: Evaluate model
        run: python scripts/evaluate_model.py

  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci
      - name: Run tests
        working-directory: ./dashboard
        run: npm test
