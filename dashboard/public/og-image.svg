<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent line -->
  <rect x="80" y="200" width="120" height="4" rx="2" fill="url(#accent)"/>
  <!-- Title -->
  <text x="80" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="white">SearchFlow</text>
  <!-- Subtitle -->
  <text x="80" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a0a0b0">Travel Search Analytics Platform</text>
  <!-- Description -->
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#707080">ML-powered churn prediction with SHAP explainability</text>
  <text x="80" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#707080">React + XGBoost + Kafka + Airflow</text>
  <!-- Logo mark -->
  <rect x="1020" y="80" width="100" height="100" rx="20" fill="url(#accent)"/>
  <text x="1070" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">SF</text>
</svg>
